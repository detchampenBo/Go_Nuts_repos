<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marvel Link Network — Explorer</title>
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Interactive explorer for the frozen Marvel superhero Wikipedia link network: 303 nodes, 1784 directed links, coloured by Louvain community."
    />
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <style>
      :root {
        --ink: #0c0d12; --panel: #15161f; --line: #2a2c3a; --text: #e9e9f0;
        --muted: #9a9db8; --lime: #c9ec45; --coral: #ff8c73; --cyan: #5cdbeb; --grey: #6a6e8c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; color: var(--text); overflow: hidden;
        background:
          radial-gradient(circle at 66% 46%, rgba(73, 83, 132, .18), transparent 38%),
          radial-gradient(circle at 18% 75%, rgba(92, 219, 235, .07), transparent 30%),
          linear-gradient(145deg, #08090d 0%, #0c0d14 52%, #10101a 100%);
        font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
        background-image: radial-gradient(rgba(255,255,255,.8) .55px, transparent .7px);
        background-size: 31px 31px; mask-image: linear-gradient(to bottom, black, transparent 82%);
      }
      body::after {
        content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background:
          linear-gradient(90deg, #08090d 0, #08090d 300px, rgba(8,9,13,.9) 330px, transparent 400px),
          linear-gradient(180deg, rgba(8,9,13,.9) 0, transparent 105px);
      }
      #links-canvas, svg { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
      #links-canvas { z-index: 0; pointer-events: none; }
      svg { z-index: 0; cursor: grab; }
      svg:active { cursor: grabbing; }

      .halo { fill: none; stroke-width: 5; opacity: .16; pointer-events: none; }
      .focus-ring { fill: none; stroke: #fff; stroke-width: 1.5; opacity: 0; pointer-events: none; }
      .focus-ring.on { opacity: .85; }
      .node {
        cursor: pointer; stroke: rgba(255,255,255,.42); stroke-width: .7;
      }
      .node:hover { stroke: white; stroke-width: 1.5; }
      .node:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
      .label {
        fill: #f6ce6d; font-weight: 600; pointer-events: none;
        paint-order: stroke; stroke: var(--ink);
      }
      .region-label {
        fill: #dfe3f1; opacity: .18; font-size: 12px; font-weight: 800;
        letter-spacing: .16em; text-transform: uppercase; text-anchor: middle;
        pointer-events: none; paint-order: stroke; stroke: #0c0d12; stroke-width: 5px;
      }
      .dim { opacity: 0.035; }
      .gone { display: none; }
      .node, .label, .halo, .region-label { transition: opacity .2s ease; }

      .card {
        position: fixed; z-index: 2;
        text-shadow: 0 2px 16px #05060a, 0 2px 16px #05060a;
      }
      .hud { top: 18px; left: 18px; width: 288px; padding: 16px 18px;
        max-height: calc(100vh - 36px); overflow-y: auto; overscroll-behavior: contain; }
      .hud::-webkit-scrollbar { width: 6px; }
      .hud::-webkit-scrollbar-thumb { background: #333644; border-radius: 3px; }
      .hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: -.01em; }
      .hud p.sub { margin: 0 0 13px; color: var(--muted); font-size: 12px; }
      .field { display: flex; gap: 8px; margin-bottom: 12px; }
      .field input[type="search"] {
        flex: 1; min-width: 0; padding: 8px 1px; border: 0; border-bottom: 1px solid #55596d;
        border-radius: 0; background: transparent; color: var(--text); font: inherit;
      }
      .field input[type="search"]:focus { border-bottom-color: var(--cyan); }
      input:focus-visible, button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }
      .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
      .seg { display: flex; gap: 14px; border-bottom: 1px solid #333644; }
      .seg button {
        padding: 6px 0 7px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
        background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer;
      }
      .seg button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--cyan); }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      button.plain {
        padding: 7px 1px; border: 0; border-bottom: 1px solid #55596d;
        border-radius: 0; background: transparent; color: var(--text); font: inherit; cursor: pointer;
      }
      button.plain:hover { color: var(--cyan); border-color: var(--cyan); }
      label.chk { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; cursor: pointer; }
      input[type="range"] { width: 100%; accent-color: var(--cyan); }
      .slideval { color: var(--text); font-variant-numeric: tabular-nums; }

      .legend { right: 18px; bottom: 18px; padding: 0; font-size: 12px; color: var(--muted);
        max-width: 220px; text-align: right; }
      .legend .k { justify-content: flex-end; }
      .legend .sizes { justify-content: flex-end; }
      @media (max-height: 620px) { .legend { display: none; } }
      .legend .k { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      .legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      .legend .ramp { height: 10px; border-radius: 5px; margin: 6px 0 3px;
        background: linear-gradient(90deg, #2b3a55, #ff8c42); }
      .legend .sizes { margin-top: 10px; display: flex; align-items: center; gap: 6px; }
      .legend .sizes i { display: inline-block; border-radius: 50%; background: #52566f; flex: none; }

      .tip {
        position: fixed; pointer-events: none; z-index: 5; max-width: 250px;
        background: #14151d; border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 12px; font-size: 12.5px; opacity: 0; transform: translateY(4px);
        transition: opacity .12s ease, transform .12s ease;
      }
      .tip.show { opacity: 1; transform: translateY(0); }
      .tip b { font-size: 13px; }
      .tip .meta { color: var(--muted); margin-top: 4px; }
      .tip .go { color: var(--cyan); margin-top: 6px; }
      .tip .num { color: var(--text); }

      .backlink {
        position: fixed; z-index: 2; top: 18px; right: 18px; color: var(--muted); text-decoration: none;
        font-size: 12px; border: 0; border-bottom: 1px solid #55596d; padding: 7px 1px;
        background: transparent; text-shadow: 0 2px 16px #05060a;
      }
      .backlink:hover { color: var(--text); }
      .ui-toggle {
        display: none; position: fixed; z-index: 4; top: 16px; left: 18px;
        padding: 7px 1px; border: 0; border-bottom: 1px solid var(--cyan);
        border-radius: 0; background: transparent; color: var(--text); font: inherit;
        font-size: 12px; cursor: pointer;
      }
      .masthead {
        position: fixed; z-index: 2; top: 20px; left: 50%; transform: translateX(-50%);
        text-align: center; pointer-events: none; text-shadow: 0 2px 18px #05060a;
      }
      .masthead strong { display: block; font-size: 11px; letter-spacing: .22em; }
      .masthead span { color: var(--muted); font-size: 10px; letter-spacing: .08em; }
      @media (max-width: 700px) {
        body::after { background: none; }
        .ui-toggle { display: block; }
        .hud, .legend { opacity: 0; visibility: hidden; pointer-events: none; }
        body.controls-open::after { background: rgba(8,9,13,.985); }
        body.controls-open .hud {
          opacity: 1; visibility: visible; pointer-events: auto;
        }
        body.controls-open .hud { top: 58px; }
        body.controls-open svg { pointer-events: none; }
        .hud { width: calc(100vw - 36px); transition: opacity .16s ease; }
        .legend { transition: opacity .16s ease; }
      }
      @media (max-width: 850px) { .masthead { display: none; } }
      button.plain[disabled] { opacity: .38; cursor: default; }
      button.plain[disabled]:hover { color: var(--muted); border-color: #55596d; }
      #playout { color: var(--cyan); font-size: 11.5px; line-height: 1.45; min-height: 1.1em; margin-top: 8px; }
      #playout b { color: #fff; }
      .tip img { width: 100%; height: 132px; object-fit: cover; border-radius: 8px;
        margin-bottom: 8px; display: block; background: #22232c; }
      .focus-ring.path-ring { stroke: #ffd166; }
      #duel { margin-top: 10px; font-size: 11.5px; color: var(--cyan); line-height: 1.55; }
      #duel b { color: #fff; }
      #duel-controls:not([hidden]) { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
      #duel-controls #g-n { min-width: 14px; text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
      #duel-route { margin-top: 7px; color: #ffd166; word-break: break-word; }
      #duel-again { margin-top: 8px; }
    </style>
  </head>
  <body>
    <canvas id="links-canvas" aria-hidden="true"></canvas>
    <svg id="canvas" role="img" aria-label="Interactive node-link diagram of the Marvel superhero Wikipedia link network"></svg>

    <div class="masthead" aria-hidden="true">
      <strong>THE MARVEL LINKVERSE</strong>
      <span>hover to reveal the direction of attention</span>
    </div>

    <button class="ui-toggle" id="ui-toggle" type="button" aria-expanded="false">Controls</button>

    <div class="card hud">
      <h1>Marvel link network</h1>
      <p class="sub">303 nodes · 1&thinsp;784 directed links</p>
      <div class="field">
        <input id="search" type="search" placeholder="Find a character  ( / )" autocomplete="off" />
        <button class="plain" id="clear" aria-label="Clear selection">Clear</button>
      </div>

      <div class="lbl">Colour by</div>
      <div class="seg" id="mode" role="group" aria-label="Colour nodes by">
        <button data-mode="community" aria-pressed="true">Community</button>
        <button data-mode="component" aria-pressed="false">Component</button>
        <button data-mode="indeg" aria-pressed="false">In-degree</button>
      </div>

      <div class="lbl">Minimum degree <span class="slideval" id="minval">0</span></div>
      <input type="range" id="mindeg" min="0" max="30" value="0" step="1" />

      <div class="row">
        <label class="chk"><input type="checkbox" id="labels" /> Hub labels</label>
        <label class="chk" title="fetch thumbnails from Wikipedia on demand"><input type="checkbox" id="faces" /> Faces</label>
        <button class="plain" id="fit">Reset view</button>
      </div>

      <div class="row" style="margin-top:10px">
        <button class="plain" id="ripple" disabled>&#9654; Ripple</button>
        <button class="plain" id="snap">&#10022; Snap</button>
        <button class="plain" id="path">&#8596; Path</button>
        <button class="plain" id="restore" hidden>&#8635; Restore</button>
      </div>
      <div id="playout"></div>
      <div id="duel" hidden>
        <div id="duel-msg"></div>
        <div id="duel-controls" hidden>
          <span>your guess</span>
          <button class="plain" id="g-dn">&minus;</button>
          <b id="g-n">3</b>
          <button class="plain" id="g-up">+</button>
          <button class="plain" id="g-go">Reveal</button>
        </div>
        <div id="duel-route"></div>
        <button class="plain" id="duel-again" hidden>&#8635; New duel</button>
      </div>
    </div>

    <div class="card legend" id="legend"></div>

    <a class="backlink" href="./">← back to the write-up</a>
    <div class="tip" id="tip"></div>

    <script>
      const WIKI = "https://en.wikipedia.org/wiki/";
      const GREY = "#5b5f7e", CORAL = "#ff8c73", LIME = "#c9ec45";
      const linkCanvas = document.querySelector("#links-canvas");
      const ctx = linkCanvas.getContext("2d");
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      function sizeLinkCanvas() {
        linkCanvas.width = Math.round(window.innerWidth * pixelRatio);
        linkCanvas.height = Math.round(window.innerHeight * pixelRatio);
      }
      sizeLinkCanvas();
      const uiToggle = document.querySelector("#ui-toggle");
      uiToggle.addEventListener("click", () => {
        const open = document.body.classList.toggle("controls-open");
        uiToggle.textContent = open ? "Close controls" : "Controls";
        uiToggle.setAttribute("aria-expanded", String(open));
      });
      const svg = d3.select("#canvas");
      const tip = d3.select("#tip");
      const root = svg.append("g");
      const gRegions = root.append("g");
      const gHalos = root.append("g");
      const gNodes = root.append("g");
      const gFocus = root.append("g");
      const gLabels = root.append("g");

      d3.json("../../../data/graph.json").then((graph) => {
        const nodes = graph.nodes;
        nodes.forEach((d, i) => { d.index = i; });
        const comms = graph.communities || [];
        const commColor = new Map(comms.map((c) => [c.id, c.color]));
        const maxIn = d3.max(nodes, (d) => d.in);
        const heat = d3.scaleLinear().domain([0, maxIn]).range(["#2b3a55", "#ff8c42"]);

        let mode = "community";
        function colorNode(d) {
          if (mode === "indeg") return heat(d.in);
          if (mode === "component")
            return d.grp === "giant" ? LIME : d.grp === "island" ? CORAL : GREY;
          // community
          return d.comm >= 0 ? commColor.get(d.comm) || LIME
               : d.grp === "island" ? CORAL : GREY;
        }

        // fit the pre-computed layout into the viewport, aspect preserved
        const W = window.innerWidth, H = window.innerHeight, pad = 72;
        const xe = d3.extent(nodes, (d) => d.x), ye = d3.extent(nodes, (d) => d.y);
        const s = Math.min((W - 2 * pad) / (xe[1] - xe[0]), (H - 2 * pad) / (ye[1] - ye[0]));
        const ox = (W - s * (xe[0] + xe[1])) / 2, oy = (H - s * (ye[0] + ye[1])) / 2;
        nodes.forEach((d) => { d.px = ox + s * d.x; d.py = oy + s * d.y; });

        const r = (d) => (d.deg === 0 ? 4 : 3 + 2.1 * Math.sqrt(d.deg));

        const outAdj = nodes.map(() => new Set());
        const inAdj = nodes.map(() => new Set());
        graph.links.forEach((l) => { outAdj[l.s].add(l.t); inAdj[l.t].add(l.s); });
        const undAdj = nodes.map((_, i) => new Set([...outAdj[i], ...inAdj[i]]));

        const linked = new Set(graph.links.map((l) => `${l.s}|${l.t}`));
        function edgeGeometry(l) {
          const a = nodes[l.s], b = nodes[l.t];
          const dx = b.px - a.px, dy = b.py - a.py, len = Math.hypot(dx, dy) || 1;
          const k = currentTransform.k;
          const sx = a.px + dx / len * (r(a) + 1) / k;
          const sy = a.py + dy / len * (r(a) + 1) / k;
          const tx = b.px - dx / len * (r(b) + 4) / k;
          const ty = b.py - dy / len * (r(b) + 4) / k;
          if (!linked.has(`${l.t}|${l.s}`)) return { sx, sy, tx, ty };
          const bend = l.s < l.t ? 10 : -10;
          const cx = (a.px + b.px) / 2 - dy / len * bend;
          const cy = (a.py + b.py) / 2 + dx / len * bend;
          return { sx, sy, tx, ty, cx, cy };
        }

        let filterHidden = new Set();
        let snapHidden = new Set();
        let hiddenIdx = new Set();
        let rippleReached = null;
        let rippleTimer = null;
        let facesOn = false;
        let tipNode = null;
        const thumbCache = new Map();
        let pathMode = 0, pathA = null, pathB = null, guessN = 3;
        let duelPath = [], duelUndirected = false;
        const duelEdges = new Set();
        let activeNode = null;
        let suppressEdges = false;
        let currentTransform = d3.zoomIdentity;
        let drawQueued = false;

        function traceEdge(g) {
          ctx.moveTo(g.sx, g.sy);
          if (g.cx == null) ctx.lineTo(g.tx, g.ty);
          else ctx.quadraticCurveTo(g.cx, g.cy, g.tx, g.ty);
        }

        function drawArrow(g, color, k) {
          const angle = Math.atan2(g.ty - (g.cy ?? g.sy), g.tx - (g.cx ?? g.sx));
          const size = 5 / k;
          ctx.beginPath();
          ctx.moveTo(g.tx, g.ty);
          ctx.lineTo(g.tx - Math.cos(angle - .52) * size, g.ty - Math.sin(angle - .52) * size);
          ctx.lineTo(g.tx - Math.cos(angle + .52) * size, g.ty - Math.sin(angle + .52) * size);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        }

        function drawEdges() {
          drawQueued = false;
          const t = currentTransform;
          ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          ctx.clearRect(0, 0, linkCanvas.width / pixelRatio, linkCanvas.height / pixelRatio);
          ctx.save();
          ctx.translate(t.x, t.y);
          ctx.scale(t.k, t.k);

          ctx.beginPath();
          for (const l of graph.links) {
            if (hiddenIdx.has(l.s) || hiddenIdx.has(l.t)) continue;
            traceEdge(edgeGeometry(l));
          }
          ctx.strokeStyle = "#59607e";
          ctx.globalAlpha = suppressEdges ? .035 : .22;
          ctx.lineWidth = .62 / t.k;
          ctx.stroke();

          if (rippleReached) {
            ctx.globalAlpha = .9; ctx.strokeStyle = "#9fc0ff"; ctx.lineWidth = 1 / t.k;
            ctx.beginPath();
            for (const l of graph.links) {
              if (hiddenIdx.has(l.s) || hiddenIdx.has(l.t)) continue;
              if (rippleReached.has(l.s) && rippleReached.has(l.t)) traceEdge(edgeGeometry(l));
            }
            ctx.stroke();
          }

          if (duelEdges.size) {
            ctx.globalAlpha = 1; ctx.strokeStyle = "#ffd166";
            ctx.lineWidth = 2.6 / t.k; ctx.lineCap = "round";
            for (const key of duelEdges) {
              const bar = key.indexOf("|");
              const a = +key.slice(0, bar), c = +key.slice(bar + 1);
              const dir = linked.has(a + "|" + c) ? { s: a, t: c } : { s: c, t: a };
              const g = edgeGeometry(dir);
              ctx.beginPath(); traceEdge(g); ctx.stroke();
              drawArrow(g, "#ffd166", t.k);
            }
            ctx.lineCap = "butt";
          }

          if (activeNode != null) {
            ctx.globalAlpha = .96;
            for (const l of graph.links) {
              if ((l.s !== activeNode && l.t !== activeNode) || hiddenIdx.has(l.s) || hiddenIdx.has(l.t)) continue;
              const color = l.s === activeNode ? "#c9ec45" : "#5cdbeb";
              const g = edgeGeometry(l);
              ctx.beginPath(); traceEdge(g);
              ctx.strokeStyle = color;
              ctx.lineWidth = 1.7 / t.k;
              ctx.stroke();
              drawArrow(g, color, t.k);
            }
          }
          ctx.restore();
          ctx.globalAlpha = 1;
        }

        function queueEdgeDraw() {
          if (drawQueued) return;
          drawQueued = true;
          requestAnimationFrame(drawEdges);
        }

        const halo = gHalos.selectAll("circle")
          .data(nodes.filter((d) => d.deg >= 20), (d) => d.id).join("circle")
          .attr("class", "halo")
          .attr("r", (d) => r(d) + 5).attr("stroke", colorNode)
          .attr("cx", (d) => d.px).attr("cy", (d) => d.py);

        const focusRing = gFocus.append("circle").attr("class", "focus-ring");
        const pathRing = gFocus.append("circle").attr("class", "focus-ring path-ring");

        const node = gNodes.selectAll("circle").data(nodes).join("circle")
          .attr("class", "node").attr("tabindex", 0)
          .attr("r", r).attr("fill", colorNode)
          .attr("cx", (d) => d.px).attr("cy", (d) => d.py)
          .on("pointerenter", (e, d) => hover(d))
          .on("pointermove", (e) => moveTip(e))
          .on("pointerleave", () => { if (pinned == null) { clearHi(); hideTip(); } })
          .on("click", (e, d) => {
            e.stopPropagation();
            if (pathMode) { pathPick(d); return; }
            stopRipple();
            if (pinned === d.index) { pinned = null; clearHi(); hideTip(); }
            else { pinned = d.index; hover(d); }
          })
          .on("dblclick", (e, d) => { e.stopPropagation(); window.open(WIKI + d.id, "_blank"); });

        node.call(d3.drag()
          .on("start", (e) => e.sourceEvent.stopPropagation())
          .on("drag", (e, d) => {
            d.px = e.x; d.py = e.y;
            d3.select(e.sourceEvent.target).attr("cx", d.px).attr("cy", d.py);
            halo.filter((n) => n.index === d.index).attr("cx", d.px).attr("cy", d.py);
            if (pinned === d.index) focusRing.attr("cx", d.px).attr("cy", d.py);
            gLabels.selectAll("text").filter((t) => t === d)
              .attr("x", d.px).attr("y", d.py - (r(d) + 5) / currentK);
            queueEdgeDraw();
          }));

        const communityCentres = d3.groups(nodes.filter((d) => d.comm >= 0), (d) => d.comm)
          .map(([id, members]) => ({
            id, label: members[0].commLabel,
            x: d3.mean(members, (d) => d.px), y: d3.mean(members, (d) => d.py),
          }));
        const regionLabel = gRegions.selectAll("text").data(communityCentres).join("text")
          .attr("class", "region-label").attr("x", (d) => d.x).attr("y", (d) => d.y)
          .text((d) => d.label);

        // ---- labels -------------------------------------------------------
        const hubIds = new Set(nodes.slice().sort((a, b) => b.deg - a.deg).slice(0, 14).map((d) => d.id));
        let showHubs = false, currentK = 1;
        function renderLabels(focus, centre) {
          let labelSet = focus;
          if (focus && focus.size > 14) {
            const ranked = [...focus].filter((i) => i !== centre)
              .sort((a, b) => nodes[b].deg - nodes[a].deg);
            labelSet = new Set(centre == null ? ranked.slice(0, 14) : [centre, ...ranked.slice(0, 12)]);
          }
          const show = nodes.filter((d) =>
            !hiddenIdx.has(d.index) &&
            ((showHubs && hubIds.has(d.id)) || (labelSet && labelSet.has(d.index))));
          gLabels.selectAll("text").data(show, (d) => d.id).join("text")
            .attr("class", "label").attr("text-anchor", "middle")
            .attr("x", (d) => d.px).attr("y", (d) => d.py - (r(d) + 5) / currentK)
            .style("font-size", 11 / currentK + "px")
            .style("stroke-width", 3 / currentK + "px")
            .text((d) => d.name);
        }

        // ---- highlight ---------------------------------------------------
        let pinned = null;
        function hover(d) {
          if (rippleReached || pathMode) {
            if (pathMode === 1 || pathMode === 2) showTip(d);
            return;
          }
          const keep = new Set([d.index, ...outAdj[d.index], ...inAdj[d.index]]);
          node.classed("dim", (n) => !keep.has(n.index));
          halo.classed("dim", (n) => !keep.has(n.index));
          regionLabel.classed("dim", true);
          activeNode = d.index;
          suppressEdges = false;
          queueEdgeDraw();
          focusRing.attr("cx", d.px).attr("cy", d.py)
            .attr("r", (r(d) + 6) / currentK).classed("on", true);
          renderLabels(keep, d.index);
          showTip(d);
          syncRipple();
        }
        function clearHi() {
          node.classed("dim", false);
          halo.classed("dim", false);
          regionLabel.classed("dim", false);
          activeNode = null;
          suppressEdges = false;
          queueEdgeDraw();
          focusRing.classed("on", false);
          renderLabels(null);
          syncRipple();
        }

        function showTip(d) {
          tipNode = d;
          const where = d.comm >= 0 ? d.commLabel
            : d.grp === "island" ? "Morituri island" : "isolate — no links";
          const pic = thumbCache.get(d.id);
          const img = pic ? `<img src="${pic}" alt="" />` : "";
          tip.html(
            img + `<b>${d.name}</b><div class="meta">` +
            `<span class="num">${d.in}</span> in · <span class="num">${d.out}</span> out · ` +
            `<span class="num">${d.deg}</span> total<br>${where}</div>` +
            `<div class="go">double-click → Wikipedia ↗</div>`
          ).classed("show", true);
          if (pic === undefined) getThumb(d).then((u) => {
            if (u && tipNode === d && tip.classed("show")) showTip(d);
          });
        }
        function moveTip(e) {
          tip.style("left", Math.min(e.clientX + 16, window.innerWidth - 264) + "px")
             .style("top", Math.min(e.clientY + 16, window.innerHeight - 110) + "px");
        }
        function hideTip() { tip.classed("show", false); }

        // ---- min-degree filter ----------------------------------------
        function recomputeHidden() {
          hiddenIdx = new Set([...filterHidden, ...snapHidden]);
          node.classed("gone", (d) => hiddenIdx.has(d.index));
          halo.classed("gone", (d) => hiddenIdx.has(d.index));
          queueEdgeDraw();
        }
        function applyFilter(minDeg) {
          filterHidden = new Set(nodes.filter((d) => d.deg < minDeg).map((d) => d.index));
          recomputeHidden();
          if (facesOn) applyFaces();
          if (pinned != null && hiddenIdx.has(pinned)) { pinned = null; clearHi(); hideTip(); }
          else renderLabels(pinned != null
            ? new Set([pinned, ...outAdj[pinned], ...inAdj[pinned]]) : null, pinned);
        }

        // ---- zoom / pan ---------------------------------------------------
        const zoom = d3.zoom().scaleExtent([0.3, 8])
          .filter((e) => !e.button && (e.type !== "mousedown" || e.target.tagName !== "circle"))
          .on("zoom", (e) => {
            currentTransform = e.transform;
            root.attr("transform", e.transform);
            queueEdgeDraw();
            if (Math.abs(e.transform.k - currentK) > 0.01) {
              currentK = e.transform.k;
              node.attr("r", (d) => r(d) / currentK)
                .style("stroke-width", .7 / currentK + "px");
              halo.attr("r", (d) => (r(d) + 5) / currentK)
                .style("stroke-width", 5 / currentK + "px");
              regionLabel.style("font-size", 12 / currentK + "px")
                .style("stroke-width", 5 / currentK + "px");
              if (activeNode != null) {
                focusRing.attr("r", (r(nodes[activeNode]) + 6) / currentK)
                  .style("stroke-width", 1.5 / currentK + "px");
              }
              if (pathMode === 2 && pathA != null) {
                pathRing.attr("r", (r(nodes[pathA]) + 7) / currentK)
                  .style("stroke-width", 1.5 / currentK + "px");
              }
              gLabels.selectAll("text")
                .style("font-size", 11 / currentK + "px")
                .style("stroke-width", 3 / currentK + "px")
                .attr("y", (d) => d.py - (r(d) + 5) / currentK);
            }
          });
        svg.call(zoom).on("dblclick.zoom", null)
          .on("click", () => { stopRipple(); if (pathMode && pathMode < 3) resetDuel(); pinned = null; clearHi(); hideTip(); });
        d3.select("#fit").on("click", () =>
          svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity));

        // ---- legend ----------------------------------------------------
        const legend = d3.select("#legend");
        function renderLegend() {
          let html = "";
          if (mode === "community") {
            html = comms.map((c) =>
              `<div class="k"><span class="dot" style="background:${c.color}"></span>${c.label}</div>`
            ).join("") +
              `<div class="k"><span class="dot" style="background:${CORAL}"></span>Morituri island</div>` +
              `<div class="k"><span class="dot" style="background:${GREY}"></span>isolate</div>`;
          } else if (mode === "component") {
            html =
              `<div class="k"><span class="dot" style="background:${LIME}"></span>giant component · 277</div>` +
              `<div class="k"><span class="dot" style="background:${CORAL}"></span>Morituri island · 9</div>` +
              `<div class="k"><span class="dot" style="background:${GREY}"></span>isolate · 17</div>`;
          } else {
            html = `<div>in-degree</div><div class="ramp"></div>` +
              `<div style="display:flex;justify-content:space-between"><span>0</span><span>${maxIn}</span></div>`;
          }
          html += `<div class="sizes"><i style="width:5px;height:5px"></i>` +
            `<i style="width:11px;height:11px"></i><i style="width:18px;height:18px"></i>` +
            `<span>size = total degree</span></div>`;
          legend.html(html);
        }

        // ---- faces: lazy Wikipedia thumbnails --------------------------
        const defs = svg.append("defs");
        const patternMade = new Set();
        let fetchQ = [], inFlight = 0;
        function getThumb(d) {
          if (thumbCache.has(d.id)) return Promise.resolve(thumbCache.get(d.id));
          return fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(d.id))
            .then((r) => (r.ok ? r.json() : null))
            .then((j) => {
              const u = (j && j.thumbnail && j.thumbnail.source) || null;
              thumbCache.set(d.id, u);
              if (u) ensurePattern(d, u);
              return u;
            })
            .catch(() => { thumbCache.set(d.id, null); return null; });
        }
        function ensurePattern(d, url) {
          if (patternMade.has(d.index)) return;
          patternMade.add(d.index);
          const p = defs.append("pattern").attr("id", "face-" + d.index)
            .attr("width", 1).attr("height", 1).attr("patternContentUnits", "objectBoundingBox");
          p.append("image").attr("href", url).attr("width", 1).attr("height", 1)
            .attr("preserveAspectRatio", "xMidYMid slice");
        }
        function faceFill(d) {
          return thumbCache.get(d.id) ? "url(#face-" + d.index + ")" : colorNode(d);
        }
        function pumpFaces() {
          while (inFlight < 6 && fetchQ.length) {
            const d = fetchQ.shift(); inFlight++;
            getThumb(d).then((u) => {
              if (u && facesOn && !hiddenIdx.has(d.index) && !rippleReached)
                node.filter((nn) => nn.index === d.index).attr("fill", "url(#face-" + d.index + ")");
            }).finally(() => { inFlight--; pumpFaces(); });
          }
        }
        function applyFaces() {
          if (!facesOn) { node.attr("fill", colorNode); return; }
          node.attr("fill", (d) => faceFill(d));
          fetchQ = nodes.filter((d) => !hiddenIdx.has(d.index) && !thumbCache.has(d.id));
          pumpFaces();
        }
        d3.select("#faces").on("change", function () { facesOn = this.checked; applyFaces(); });

        // ---- ripple: BFS wave from the pinned character --------------
        const HOPCOL = ["#ffffff", "#c9ec45", "#5cdbeb", "#4e9be6", "#a274e6", "#ff7ac0", "#ff8c73", "#f6ce6d"];
        const rippleBtn = d3.select("#ripple");
        const playout = d3.select("#playout");
        function syncRipple() {
          const on = pinned != null;
          rippleBtn.attr("disabled", on ? null : "")
            .text(on ? "▶ Ripple from " + nodes[pinned].name.split(" (")[0] : "▶ Ripple");
        }
        function stopRipple() {
          if (rippleTimer) { clearInterval(rippleTimer); rippleTimer = null; }
          if (!rippleReached) return;
          rippleReached = null;
          node.classed("dim", false).attr("fill", facesOn ? faceFill : colorNode);
          halo.classed("dim", false);
          regionLabel.classed("dim", false);
          focusRing.classed("on", false);
          activeNode = null;
          renderLabels(null);
          queueEdgeDraw();
          playout.html("");
        }
        function startRipple(src) {
          stopRipple();
          suppressEdges = false;
          hideTip();
          renderLabels(null);
          focusRing.classed("on", false);
          const hop = new Array(nodes.length).fill(-1);
          hop[src] = 0;
          let frontier = [src];
          const layers = [[src]];
          while (frontier.length) {
            const next = [];
            for (const u of frontier)
              for (const v of undAdj[u])
                if (hop[v] === -1 && !hiddenIdx.has(v)) { hop[v] = hop[u] + 1; next.push(v); }
            if (next.length) layers.push(next);
            frontier = next;
          }
          const total = layers.reduce((a, l) => a + l.length, 0);
          rippleReached = new Set([src]);
          node.classed("dim", (d) => d.index !== src)
            .attr("fill", (d) => (d.index === src ? HOPCOL[0] : "#26262f"));
          halo.classed("dim", true);
          regionLabel.classed("dim", true);
          activeNode = null;
          queueEdgeDraw();
          playout.html("hop 0 &mdash; 1 / " + total + " reached");
          let k = 0;
          rippleTimer = setInterval(() => {
            k++;
            if (k >= layers.length) {
              clearInterval(rippleTimer); rippleTimer = null;
              playout.html("<b>" + nodes[src].name.split(" (")[0] + "</b> reaches all "
                + rippleReached.size + " in " + (layers.length - 1) + " hops");
              return;
            }
            layers[k].forEach((i) => rippleReached.add(i));
            node.classed("dim", (d) => hop[d.index] < 0 || hop[d.index] > k)
              .attr("fill", (d) => (hop[d.index] >= 0 && hop[d.index] <= k
                ? HOPCOL[Math.min(hop[d.index], HOPCOL.length - 1)] : "#26262f"));
            queueEdgeDraw();
            playout.html("hop " + k + " &mdash; " + rippleReached.size + " / " + total + " reached");
          }, 640);
        }
        rippleBtn.on("click", () => { if (pinned != null) startRipple(pinned); });

        // ---- Thanos snap: a random half turns to dust ---------------
        const restoreBtn = d3.select("#restore");
        function giantAmong(alive) {
          const seen = new Set();
          let best = 0;
          for (const start of alive) {
            if (seen.has(start)) continue;
            let size = 0;
            const stack = [start];
            seen.add(start);
            while (stack.length) {
              const u = stack.pop(); size++;
              for (const v of undAdj[u])
                if (alive.has(v) && !seen.has(v)) { seen.add(v); stack.push(v); }
            }
            if (size > best) best = size;
          }
          return best;
        }
        d3.select("#snap").on("click", () => {
          stopRipple(); pinned = null; clearHi(); hideTip();
          const alive = nodes.filter((d) => !hiddenIdx.has(d.index));
          const shuffled = alive.slice().sort(() => Math.random() - 0.5);
          const dust = new Set(shuffled.slice(0, Math.floor(alive.length / 2)).map((d) => d.index));
          node.filter((d) => dust.has(d.index))
            .transition().duration(1200).delay(() => Math.random() * 700)
            .style("opacity", 0)
            .attr("transform", () => "translate(" + (Math.random() - .5) * 44 + ","
              + (-26 - Math.random() * 46) + ")")
            .on("end", function () { d3.select(this).style("opacity", null).attr("transform", null); });
          setTimeout(() => {
            snapHidden = dust;
            recomputeHidden();
            if (facesOn) applyFaces();
            const aliveSet = new Set(nodes.filter((d) => !hiddenIdx.has(d.index)).map((d) => d.index));
            playout.html("snapped <b>" + dust.size + "</b> &middot; " + aliveSet.size
              + " left &middot; largest surviving cluster <b>" + giantAmong(aliveSet) + "</b>");
            restoreBtn.attr("hidden", null);
          }, 2000);
        });
        restoreBtn.on("click", () => {
          const back = snapHidden;
          snapHidden = new Set();
          recomputeHidden();
          if (facesOn) applyFaces();
          node.filter((d) => back.has(d.index)).style("opacity", 0)
            .transition().duration(600).style("opacity", null);
          restoreBtn.attr("hidden", "");
          playout.html("");
        });

        // ---- six-degrees path duel ----------------------------------
        const pathBtn = d3.select("#path");
        function shortName(i) { return nodes[i].name.split(" (")[0]; }
        function shortestPath(a, b, adj) {
          if (a === b) return [a];
          const prev = new Map([[a, -1]]);
          const q = [a];
          for (let h = 0; h < q.length; h++) {
            const u = q[h];
            for (const v of adj[u]) {
              if (hiddenIdx.has(v) || prev.has(v)) continue;
              prev.set(v, u);
              if (v === b) {
                const out = [b];
                let c = u;
                while (c !== -1) { out.push(c); c = prev.get(c); }
                return out.reverse();
              }
              q.push(v);
            }
          }
          return null;
        }
        function duelClearVisuals() {
          node.classed("dim", false).attr("fill", facesOn ? faceFill : colorNode);
          halo.classed("dim", false);
          regionLabel.classed("dim", false);
          pathRing.classed("on", false);
          duelEdges.clear();
          queueEdgeDraw();
        }
        function resetDuel() {
          if (!pathMode) return;
          pathMode = 0; pathA = null; pathB = null; duelPath = [];
          duelClearVisuals();
          d3.select("#duel").attr("hidden", "");
          d3.select("#duel-controls").attr("hidden", "");
          d3.select("#duel-again").attr("hidden", "");
          pathBtn.text("↔ Path");
        }
        function beginPick() {
          pathA = null; pathB = null; duelPath = []; pathMode = 1;
          duelClearVisuals();
          d3.select("#duel").attr("hidden", null);
          d3.select("#duel-controls").attr("hidden", "");
          d3.select("#duel-again").attr("hidden", "");
          d3.select("#duel-route").html("");
          d3.select("#duel-msg").html("click the <b>start</b> character");
        }
        function pathPick(d) {
          if (pathMode === 1) {
            pathA = d.index; pathMode = 2;
            pathRing.attr("cx", d.px).attr("cy", d.py)
              .attr("r", (r(d) + 7) / currentK)
              .style("stroke-width", 1.5 / currentK + "px").classed("on", true);
            d3.select("#duel-msg").html("start <b>" + shortName(pathA)
              + "</b> &mdash; now click the <b>target</b>");
            return;
          }
          if (pathMode === 2) {
            if (d.index === pathA) return;
            pathB = d.index;
            duelUndirected = false;
            let p = shortestPath(pathA, pathB, outAdj);
            if (!p) { p = shortestPath(pathA, pathB, undAdj); duelUndirected = true; }
            if (!p) {
              d3.select("#duel-msg").html("<b>" + shortName(pathB) + "</b> is unreachable from <b>"
                + shortName(pathA) + "</b> &mdash; different components. Pick another target.");
              return;
            }
            duelPath = p; pathMode = 3;
            d3.select("#duel-msg").html("how many hops from <b>" + shortName(pathA)
              + "</b> to <b>" + shortName(pathB) + "</b>?");
            d3.select("#duel-controls").attr("hidden", null);
            d3.select("#duel-route").html("");
          }
        }
        function runDuel() {
          if (pathMode !== 3) return;
          d3.select("#duel-controls").attr("hidden", "");
          duelEdges.clear();
          const p = duelPath;
          const inPath = new Set(p);
          node.classed("dim", (d) => !inPath.has(d.index))
            .attr("fill", (d) => (inPath.has(d.index) ? "#3a3d52" : "#24242c"));
          halo.classed("dim", true);
          regionLabel.classed("dim", true);
          activeNode = null;
          const route = d3.select("#duel-route");
          route.html("<b>" + shortName(p[0]) + "</b>");
          node.filter((d) => d.index === p[0]).attr("fill", "#ffd166");
          queueEdgeDraw();
          let k = 0;
          const timer = setInterval(() => {
            k++;
            if (k >= p.length) {
              clearInterval(timer);
              const actual = p.length - 1;
              const hit = guessN === actual;
              const hp = actual + " hop" + (actual === 1 ? "" : "s");
              d3.select("#duel-msg").html(
                (hit ? "&#127919; <b>spot on</b> &mdash; " + hp
                     : "you guessed <b>" + guessN + "</b> &middot; the real chain is <b>" + hp + "</b>")
                + (duelUndirected ? " <span style='color:var(--muted)'>(links either way)</span>" : ""));
              d3.select("#duel-again").attr("hidden", null);
              pathMode = 4;
              return;
            }
            duelEdges.add(p[k - 1] + "|" + p[k]);
            node.filter((d) => d.index === p[k]).attr("fill", "#ffd166");
            route.html(route.html() + " &rarr; <b>" + shortName(p[k]) + "</b>");
            queueEdgeDraw();
          }, 720);
        }
        function setGuess(v) { guessN = Math.max(1, Math.min(8, v)); d3.select("#g-n").text(guessN); }
        pathBtn.on("click", () => {
          if (pathMode) { resetDuel(); return; }
          stopRipple(); pinned = null; clearHi(); hideTip();
          d3.select("#search").property("value", "");
          renderLabels(null);
          pathBtn.text("✕ Cancel");
          beginPick();
        });
        d3.select("#g-dn").on("click", () => setGuess(guessN - 1));
        d3.select("#g-up").on("click", () => setGuess(guessN + 1));
        d3.select("#g-go").on("click", runDuel);
        d3.select("#duel-again").on("click", () => { d3.select("#duel-again").attr("hidden", ""); beginPick(); });

        // ---- controls ------------------------------------------------
        d3.selectAll("#mode button").on("click", function () {
          mode = this.dataset.mode;
          d3.selectAll("#mode button").attr("aria-pressed", (d, i, n) => n[i] === this);
          node.transition().duration(250).attr("fill", facesOn ? faceFill : colorNode);
          halo.transition().duration(250).attr("stroke", colorNode);
          regionLabel.transition().duration(200).style("opacity", mode === "community" ? null : 0);
          renderLegend();
        });
        const mindeg = d3.select("#mindeg");
        mindeg.on("input", function () {
          d3.select("#minval").text(this.value);
          applyFilter(+this.value);
        });
        d3.select("#labels").on("change", function () {
          showHubs = this.checked;
          renderLabels(pinned != null
            ? new Set([pinned, ...outAdj[pinned], ...inAdj[pinned]]) : null, pinned);
        });
        d3.select("#clear").on("click", () => {
          stopRipple(); resetDuel(); pinned = null; clearHi(); hideTip(); d3.select("#search").property("value", "");
        });
        const search = d3.select("#search");
        search.on("input", function () {
          const q = this.value.trim().toLowerCase();
          if (!q) { clearHi(); return; }
          const hits = nodes.filter((d) => !hiddenIdx.has(d.index) && d.name.toLowerCase().includes(q));
          const keep = new Set(hits.map((d) => d.index));
          node.classed("dim", (n) => !keep.has(n.index));
          halo.classed("dim", (n) => !keep.has(n.index));
          regionLabel.classed("dim", true);
          activeNode = null;
          suppressEdges = true;
          queueEdgeDraw();
          renderLabels(keep);
          if (hits.length) {
            const bx = d3.extent(hits, (d) => d.px), by = d3.extent(hits, (d) => d.py);
            const k = Math.min(6, 0.8 * Math.min(W / (bx[1] - bx[0] + 120), H / (by[1] - by[0] + 120)));
            svg.transition().duration(450).call(zoom.transform,
              d3.zoomIdentity.translate(W / 2, H / 2).scale(k)
                .translate(-(bx[0] + bx[1]) / 2, -(by[0] + by[1]) / 2));
          }
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "/" && document.activeElement !== search.node()) {
            e.preventDefault(); search.node().focus();
          }
          if (e.key === "Escape") { stopRipple(); resetDuel(); pinned = null; clearHi(); hideTip(); search.node().blur(); }
        });

        window.addEventListener("resize", () => { sizeLinkCanvas(); queueEdgeDraw(); });
        drawEdges();
        renderLegend();
        syncRipple();
      });
    </script>
  </body>
</html>
