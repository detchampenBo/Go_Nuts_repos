<!DOCTYPE html>
<!-- saved from url=(0079)https://sunelehmann.com/socialgraphs2026-web/explorables/cosine-similarity.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Explorable · Cosine similarity</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./explore.css">
  <link rel="stylesheet" href="./text-explore.css">
  <link rel="stylesheet" href="./document-vector-explore.css">
</head>
<body class="cosine-page-clean">
  <div class="cosine-clean-toolbar">
    <div class="preset-row" aria-label="Cosine presets">
      <button type="button" data-preset="similar" class="">D1 vs D2</button>
      <button type="button" data-preset="different" class="primary">D1 vs D3</button>
      <button type="button" data-preset="same" class="">same direction, longer</button>
    </div>
    <div class="controls cosine-clean-controls">
      <label>A <select id="doc-a"><option value="0">D1 · mutant superpower</option><option value="1">D2 · superpower felt</option><option value="2">D3 · Avengers</option></select></label>
      <label>B <select id="doc-b"><option value="0">D1 · mutant superpower</option><option value="1">D2 · superpower felt</option><option value="2">D3 · Avengers</option></select></label>
      <label>Scale B <input id="scale-b" type="range" min="0.5" max="2.5" step="0.1" value="1"><span class="val" id="scale-val">1.0×</span></label>
    </div>
  </div>

  <div class="cosine-clean-stage">
    <svg id="plot" viewBox="0 0 900 360" role="img" aria-label="Two vectors and the angle between them">
    <defs>
      <marker id="axisArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0.5,0.6 L5.8,3 L0.5,5.4 z" fill="var(--text-secondary)"></path></marker>
      <marker id="arrowA" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path d="M0.5,0.6 L5.8,3 L0.5,5.4 z" fill="var(--series-1)"></path></marker>
      <marker id="arrowB" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path d="M0.5,0.6 L5.8,3 L0.5,5.4 z" fill="var(--series-2)"></path></marker>
    </defs>
    <line x1="250" y1="40" x2="250" y2="325" class="physics-grid"></line><line x1="310" y1="40" x2="310" y2="325" class="physics-grid"></line><line x1="370" y1="40" x2="370" y2="325" class="physics-grid"></line><line x1="430" y1="40" x2="430" y2="325" class="physics-grid"></line><line x1="490" y1="40" x2="490" y2="325" class="physics-grid"></line><line x1="550" y1="40" x2="550" y2="325" class="physics-grid"></line><line x1="610" y1="40" x2="610" y2="325" class="physics-grid"></line><line x1="670" y1="40" x2="670" y2="325" class="physics-grid"></line><line x1="730" y1="40" x2="730" y2="325" class="physics-grid"></line><line x1="790" y1="40" x2="790" y2="325" class="physics-grid"></line>
    <line x1="70" y1="65" x2="825" y2="65" class="physics-grid"></line><line x1="70" y1="125" x2="825" y2="125" class="physics-grid"></line><line x1="70" y1="185" x2="825" y2="185" class="physics-grid"></line><line x1="70" y1="245" x2="825" y2="245" class="physics-grid"></line>
    <line x1="70" y1="305" x2="835" y2="305" class="physics-axis" marker-end="url(#axisArrow)"></line>
    <line x1="190" y1="330" x2="190" y2="35" class="physics-axis" marker-end="url(#axisArrow)"></line>
    <circle cx="190" cy="305" r="3" class="origin-dot"></circle>
    <line x1="190" y1="305" x2="408.31653841209925" y2="250.56757349007478" class="cos-vector vector-a" marker-end="url(#arrowA)"></line>
    <line x1="190" y1="305" x2="147.66366827005817" y2="135.19824790170063" class="cos-vector vector-b" marker-end="url(#arrowB)"></line>
    <path d="M 250.15833502911178 290.0008424728206 A 62 62 0 0 0 175.0008424728206 244.84166497088822" class="cos-arc"></path>
    <text x="233.26319829244457" y="232.9979467410226" class="theta-label" text-anchor="middle">θ</text>
    <text x="420.31653841209925" y="244.56757349007478" class="vector-tag tag-a">A</text>
    <text x="159.66366827005817" y="129.19824790170063" class="vector-tag tag-b">B</text></svg>
  </div>

  <div class="cosine-clean-bottom">
    <div class="cosine-clean-metrics">
      <div class="cosine-big compact"><div class="label">cosine similarity</div><div class="value" id="cosine">0.000</div></div>
      <div class="cosine-big compact"><div class="label">angle</div><div class="value" id="angle">90.0°</div></div>
    </div>
    <div class="cosine-clean-sentences">
      <div class="simple-sentence a"><span>A</span><p id="sentence-a">D1: The mutant superpower was wild and dangerous.</p></div>
      <div class="simple-sentence b"><span>B</span><p id="sentence-b">D3: The Avengers assembled before the battle.</p></div>
    </div>
  </div>

  <script src="./cosine-similarity.js.download"></script>


</body></html>
